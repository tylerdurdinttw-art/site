services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-quickpanel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}
      POSTGRES_DB: ${POSTGRES_DB:-quickpanel}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-quickpanel}']
      interval: 5s
      timeout: 5s
      retries: 10
    # Наружу порт не отдаём: к базе ходит только приложение из этой же сети.
    expose:
      - '5432'

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-quickpanel}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-quickpanel}?schema=public
    ports:
      # Слушаем только localhost — наружу панель отдаёт nginx с сертификатом.
      - '127.0.0.1:3000:3000'
    volumes:
      # Базы MaxMind лежат на хосте, в образ их класть незачем.
      - ./geoip:/app/geoip:ro

volumes:
  db-data:
